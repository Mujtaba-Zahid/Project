name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: finance_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: finance_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 black

      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined symbols
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Code Formatting
        run: |
          black --check . --exclude "/(venv|migrations|build|dist)/"

      - name: Run Test Suite
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key-for-testing
        run: |
          python -m unittest discover -s tests -t .
